version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://chefshift:chefshift_password@db:5432/chefshift?schema=public
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-in-production}
      - MOLLIE_API_KEY=${MOLLIE_API_KEY:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - REDIS_URL=redis://redis:6379
      - APP_URL=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npx prisma migrate deploy && npm run db:seed && npm run dev"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chefshift
      POSTGRES_PASSWORD: chefshift_password
      POSTGRES_DB: chefshift
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chefshift -d chefshift"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
